<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospitais, farmácias e delegacias por CEP</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  form { display: flex; gap: .5rem; }
  input[type=text] { flex: 1; padding: .6rem; font-size: 1rem; border: 1px solid #bbb; border-radius: 6px; }
  button { padding: .6rem 1rem; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .filtros { margin: 1rem 0; }
  .filtros label { margin-right: 1rem; }
  .addr { background: #f3f4f6; padding: .8rem; border-radius: 6px; margin: 1rem 0; }
  .item { border-bottom: 1px solid #eee; padding: .6rem 0; }
  .item small { color: #666; }
  .erro { color: #b91c1c; }
  .aviso { font-size: .8rem; color: #666; margin-top: 2rem; }
</style>
</head>
<body>
<h1>Hospitais, farmácias e delegacias por CEP</h1>

<form id="form">
  <input type="text" id="cep" placeholder="00000-000" inputmode="numeric" maxlength="9" required>
  <button id="btn" type="submit">Buscar</button>
</form>

<div class="filtros" id="filtros"></div>
<div id="resultado"></div>

<p class="aviso">
  Endereço: BrasilAPI. Locais: OpenStreetMap (Overpass). Os dados de locais são colaborativos
  e podem estar incompletos; confirme horários e telefones antes de ir.
</p>

<script>
const RAIO = 3000; // metros
const TIPOS = {
  hospital: { singular: 'Hospital',   plural: 'Hospitais' },
  pharmacy: { singular: 'Farmácia',   plural: 'Farmácias' },
  police:   { singular: 'Delegacia',  plural: 'Delegacias' }
};

const $ = id => document.getElementById(id);
let cache = [];
const ativos = new Set(Object.keys(TIPOS));

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function mostrarErro(msg) {
  $('resultado').innerHTML = `<p class="erro">${esc(msg)}</p>`;
}

function distancia(lat1, lon1, lat2, lon2) {
  const R = 6371000, toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

// Máscara do CEP
$('cep').addEventListener('input', e => {
  const v = e.target.value.replace(/\D/g, '').slice(0, 8);
  e.target.value = v.length > 5 ? v.slice(0, 5) + '-' + v.slice(5) : v;
});

// 1. Endereço + coordenadas via BrasilAPI (v2)
async function buscarCep(cep) {
  const r = await fetch(`https://brasilapi.com.br/api/cep/v2/${cep}`);
  if (r.status === 404) throw new Error('CEP não encontrado.');
  if (!r.ok) throw new Error('Erro ao consultar o CEP. Tente novamente.');
  return r.json();
}

// 2. Se a BrasilAPI não trouxer coordenadas, geocodifica pelo endereço (Nominatim)
async function geocodificar(e) {
  const consultas = [
    e.street && `${e.street}, ${e.city} - ${e.state}, Brasil`,
    `${e.city} - ${e.state}, Brasil`
  ].filter(Boolean);
  for (const q of consultas) {
    const r = await fetch(
      `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q=${encodeURIComponent(q)}`
    );
    const d = await r.json();
    if (d.length) return { lat: parseFloat(d[0].lat), lon: parseFloat(d[0].lon) };
  }
  throw new Error('Não foi possível localizar as coordenadas desse CEP.');
}

// 3. Busca hospitais, farmácias e delegacias no raio (Overpass)
async function buscarLugares(lat, lon) {
  const q = `[out:json][timeout:25];
nwr["amenity"~"^(hospital|pharmacy|police)$"](around:${RAIO},${lat},${lon});
out center tags;`;
  const r = await fetch('https://overpass-api.de/api/interpreter', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'data=' + encodeURIComponent(q)
  });
  if (!r.ok) throw new Error('Serviço de mapas indisponível no momento. Tente novamente.');
  const d = await r.json();

  return d.elements.map(el => {
    const plat = el.lat ?? el.center?.lat;
    const plon = el.lon ?? el.center?.lon;
    const tags = el.tags || {};
    const tipo = tags.amenity;
    return {
      tipo,
      nome: tags.name || `${TIPOS[tipo].singular} (sem nome)`,
      endereco: [
        tags['addr:street'],
        tags['addr:housenumber'],
        tags['addr:suburb'] || tags['addr:neighbourhood']
      ].filter(Boolean).join(', '),
      telefone: tags.phone || tags['contact:phone'] || '',
      distancia: distancia(lat, lon, plat, plon),
      lat: plat,
      lon: plon
    };
  }).sort((a, b) => a.distancia - b.distancia);
}

// Fluxo principal
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const cep = $('cep').value.replace(/\D/g, '');
  if (cep.length !== 8) return mostrarErro('Informe um CEP com 8 dígitos.');

  $('btn').disabled = true;
  $('resultado').innerHTML = 'Buscando...';
  $('filtros').innerHTML = '';

  try {
    const endereco = await buscarCep(cep);
    let lat = parseFloat(endereco.location?.coordinates?.latitude);
    let lon = parseFloat(endereco.location?.coordinates?.longitude);
    if (isNaN(lat) || isNaN(lon)) {
      ({ lat, lon } = await geocodificar(endereco));
    }
    const lugares = await buscarLugares(lat, lon);
    renderizar(endereco, lugares);
  } catch (err) {
    mostrarErro(err.message);
  } finally {
    $('btn').disabled = false;
  }
});

function renderizar(e, lugares) {
  cache = lugares;
  $('resultado').innerHTML = `
    <div class="addr">
      <strong>${esc(e.street || 'Logradouro não informado')}</strong><br>
      ${esc(e.neighborhood || '')} — ${esc(e.city)}/${esc(e.state)}<br>
      CEP ${esc(e.cep)}
    </div>
    <p id="contagem"></p>
    <div id="lista"></div>`;

  $('filtros').innerHTML = Object.entries(TIPOS).map(([k, t]) =>
    `<label><input type="checkbox" value="${k}" checked> ${t.plural}</label>`).join('');

  $('filtros').querySelectorAll('input').forEach(cb =>
    cb.addEventListener('change', () => {
      cb.checked ? ativos.add(cb.value) : ativos.delete(cb.value);
      listar();
    }));

  listar();
}

function listar() {
  const visiveis = cache.filter(l => ativos.has(l.tipo));
  $('contagem').textContent = `${visiveis.length} local(is) encontrado(s) em até ${RAIO / 1000} km`;

  if (!visiveis.length) {
    $('lista').innerHTML = '<p>Nenhum resultado para os filtros selecionados.</p>';
    return;
  }

  $('lista').innerHTML = visiveis.map(l => `
    <div class="item">
      <strong>${esc(l.nome)}</strong>
      <small>· ${TIPOS[l.tipo].singular} · ${(l.distancia / 1000).toFixed(2)} km</small><br>
      ${l.endereco ? esc(l.endereco) + '<br>' : ''}
      ${l.telefone ? 'Tel: ' + esc(l.telefone) + '<br>' : ''}
      <a href="https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lon}" target="_blank" rel="noopener">Ver no mapa</a>
    </div>`).join('');
}
</script>
</body>
</html>
